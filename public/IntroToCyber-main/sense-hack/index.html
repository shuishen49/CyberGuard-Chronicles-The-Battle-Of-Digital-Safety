<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>识破黑客 👹</title>
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="images/favicon.png"
    />

    <link rel="stylesheet" href="styles/style.css" type="text/css" />
    <link rel="stylesheet" href="customize.css" type="text/css" />
    <script src="cards.js" type="text/javascript"></script>
  </head>

  <body>
    <div class="game-board">
      <!-- <h1>
        <strong>黑客攻击卡牌</strong> <br />
        选择最合适的卡片，挡住黑客的攻击 <br />
      </h1> -->
      <div class="title-h1">
        <h1>
          <strong>黑客攻击卡牌</strong> <br />
          选择最合适的卡片，挡住黑客的攻击
        </h1>
      </div>
      <div class="hacker-area">
        <div class="stats hacker-stats">
          <div class="life-bar">
            <div class="life-left hacker-color"></div>
          </div>
          <div class="life-total"></div>
          <div class="thumbnail">
            <img src="images/1.png" alt="hacker" />
          </div>
          <div class="name">黑客</div>
        </div>

        <div class="card hacker-card hacker-color">
          <div class="text"></div>
          <div class="power"></div>
        </div>
      </div>

      <div class="player-area">
        <div class="stats player-stats">
          <div class="life-bar">
            <div class="life-left player-color"></div>
          </div>
          <div class="life-total"></div>
          <!-- 这里可以修改名称和表情 -->
          <div class="thumbnail">
            <img src="images/2.png" alt="hacker" />
          </div>
          <div class="name">你</div>
        </div>

        <div class="card player-card player-color">
          <div class="text"></div>
          <div class="power"></div>
        </div>

        <div class="card player-card player-color">
          <div class="text"></div>
          <div class="power"></div>
        </div>

        <div class="card player-card player-color">
          <div class="text"></div>
          <div class="power"></div>
        </div>

        <button class="start-game" onClick="startGame()">开始游戏！</button>
        <button class="next-turn" onClick="playTurn()">下一回合！</button>
      </div>
    </div>

    <div class="winner-section">
      <div>
        <span class="winner-message">你被黑客攻破了！</span>
        <button class="restart" onClick="location.reload()">再来一局</button>
      </div>
    </div>

    <script src="scripts/script.js" type="text/javascript"></script>
  </body>
</html>
